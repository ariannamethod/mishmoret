name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libmicrohttpd-dev libsqlite3-dev libsodium-dev libjson-c-dev python3
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libmicrohttpd sqlite libsodium json-c python
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Build and integration tests
        run: make -j2 check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test tools
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/mishmoret-browser-tools" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/mishmoret-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke test
        if: runner.os == 'Linux'
        env:
          NODE_PATH: ${{ runner.temp }}/mishmoret-browser-tools/node_modules
          BROWSER_ARTIFACTS: ${{ runner.temp }}/mishmoret-browser-artifacts
        run: node tests/browser_smoke.cjs
      - name: Browser screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/mishmoret-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Address and undefined behavior sanitizers
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make sanitize
          python3 -m unittest discover -s tests -v
